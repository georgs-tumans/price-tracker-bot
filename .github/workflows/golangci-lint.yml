name: GolangCI-Lint

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Run Golang linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.4

      - name: Install golangci-lint
        run: |
          set -o pipefail

          VERSION=v2.13.2
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          ARCH="${{ runner.arch }}"

          case "$ARCH" in
            X64) ARCH=amd64 ;;
            ARM64) ARCH=arm64 ;;
            *)
              echo "Unsupported runner architecture: $ARCH"
              exit 1
              ;;
          esac

          ARCHIVE="golangci-lint-${VERSION#v}-${OS}-${ARCH}.tar.gz"
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/${VERSION}/${ARCHIVE}" | tar -xz
          install -m 0755 "golangci-lint-${VERSION#v}-${OS}-${ARCH}/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"

      - name: Run GolangCI-Lint
        run: |
          set -euo pipefail

          golangci-lint run --config=.golangci.yml --timeout=5m

          format_diff_file=$(mktemp)
          if ! golangci-lint fmt --config=.golangci.yml --diff > "$format_diff_file"; then
            cat "$format_diff_file"
            echo "golangci-lint fmt failed"
            exit 1
          fi

          if [ -s "$format_diff_file" ]; then
            cat "$format_diff_file"
            echo "golangci-lint fmt found formatting drift"
            exit 1
          fi
