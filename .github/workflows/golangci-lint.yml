name: GolangCI-Lint

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Run Golang linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.4

      - name: Install golangci-lint
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz \
            | tar -xz
          install -m 0755 golangci-lint-2.13.2-linux-amd64/golangci-lint $(go env GOPATH)/bin/golangci-lint

      - name: Run GolangCI-Lint
        run: |
          golangci-lint run --config=.golangci.yml --timeout=5m
          golangci-lint fmt --config=.golangci.yml --diff
