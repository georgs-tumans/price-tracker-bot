name: price-tracker-bot

services:
  price_tracker_bot:
    build: ..
    image: price_tracker_bot
    container_name: price_tracker_bot
    env_file: ../.env
    restart: unless-stopped
    volumes:
      - bot-data:/data # Running trackers, resumed after restarts
    # Hardening: the only writable place is the /data volume, and the process gets no extra privileges
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
