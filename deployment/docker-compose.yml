name: price-tracker-bot

services:
  price_tracker_bot:
    build: ..
    image: price_tracker_bot
    container_name: price_tracker_bot
    env_file: ../.env
    environment:
      STATE_FILE: /data/state.json
    restart: unless-stopped
    volumes:
      - bot-data:/data # Running trackers, resumed after restarts

volumes:
  bot-data:
